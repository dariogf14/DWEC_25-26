<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Seguridad y Consumo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Dashboard de Seguridad y Consumo</h1>

  <section class="total">
    <h2>Resumen Global</h2>
    <div id="totalConsumo">Consumo Total detectado: 0.00 MB</div>
    <p id="mensaje" class="mensaje">Cargando logs...</p>
  </section>

  <table>
    <thead>
      <tr>
        <th>ID Sesión</th>
        <th>Usuario</th>
        <th>Consumo (MB)</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tablaLogs"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
