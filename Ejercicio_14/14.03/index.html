<body>
  <header>

  <main>
    <div id="banner" class="banner hidden">
      <span id="bannerTexto"></span>
      <button id="cerrarBanner" class="secondary">Cerrar</button>
    </div>

    <section class="panel">
      <h2>Página de ejemplo</h2>
