<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio 15.03 - Planificador de rutas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQfNnuFLj7R5wEIRw8xT1jz9HoBYaGw="
    crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Planificador de Rutas Geográficas</h1>
  </header>

  <main>
    <section class="panel">
      <form id="pointForm">
        <label>
          Latitud
          <input type="number" id="latitud" step="any" placeholder="Ej: 40.4168" required />
        </label>

        <label>
          Longitud
          <input type="number" id="longitud" step="any" placeholder="Ej: -3.7038" required />
        </label>

        <button type="submit">Añadir Punto</button>
        <button type="button" id="clearBtn" class="secondary">Limpiar Ruta</button>
      </form>

      <p id="message" class="message hidden"></p>

      <h2>Distancia total: <span id="totalDistance">0.00 km</span></h2>
    </section>

    <section id="map"></section>

    <section class="panel">
      <h2>Puntos de la Ruta</h2>
      <ol id="pointsList"></ol>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
