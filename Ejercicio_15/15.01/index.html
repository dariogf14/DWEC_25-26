<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio 15.01 - Procesador de imágenes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Procesador de Imágenes por Lotes</h1>
  </header>

  <main>
    <section id="dropZone" class="drop-zone">
      <p>Arrastra y suelta imágenes aquí</p>
      <p>o</p>
      <label for="fileInput" class="file-label">Seleccionar imágenes</label>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </section>

    <section class="options">
      <h2>Opciones de edición</h2>

      <div class="form-grid">
        <label>
          Marca de agua
          <input type="text" id="watermarkText" value="© Mi App" />
        </label>

        <label>
          Ancho máximo en píxeles
          <input type="number" id="maxWidth" value="800" min="100" step="50" />
        </label>

        <label>
          Formato de salida
          <select id="outputFormat">
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
          </select>
        </label>
      </div>

      <button id="processBtn">Procesar imágenes</button>
      <button id="clearBtn" class="secondary">Limpiar todo</button>
    </section>

    <section>
      <h2>Imágenes cargadas</h2>
      <div id="previewList" class="image-grid"></div>
    </section>

    <section>
      <h2>Resultados</h2>
      <div id="resultsList" class="image-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
