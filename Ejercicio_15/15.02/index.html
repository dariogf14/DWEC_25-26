<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio 15.02 - Kanban Drag and Drop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Tablero Kanban Interactivo</h1>
  </header>

  <main>
    <section class="board">
      <div class="column" data-status="todo">
        <h2>Tareas por hacer</h2>
        <div class="task-list" id="todo"></div>
      </div>

      <div class="column" data-status="progress">
        <h2>En progreso</h2>
        <div class="task-list" id="progress"></div>
      </div>

      <div class="column" data-status="done">
        <h2>Finalizado</h2>
        <div class="task-list" id="done"></div>
      </div>
    </section>

    <section class="info">
      <h2>Estado interno</h2>
      <pre id="stateOutput"></pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
